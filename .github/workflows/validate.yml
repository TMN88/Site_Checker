name: Validate Site_Checker sources

on:
  push:
  pull_request:

jobs:
  shell-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          set -eu
          for file in install.sh files/sitecheck-check files/sitecheck-check-zapret; do
            sh -n "$file"
          done
      - name: Check LuCI JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("files/view/index.htm").read_text()
          script = page.split("<script>", 1)[1].split("</script>", 1)[0]
          script = script.replace("<%=url('admin/services/sitecheck')%>", "/admin/services/sitecheck")
          script = script.replace("<%=token%>", "test-token")
          Path("/tmp/site-checker-ui.js").write_text(script)
          PY
          node --check /tmp/site-checker-ui.js
      - name: Verify package source mirrors
        run: |
          set -eu
          for file in controller/sitecheck.lua view/index.htm sitecheck-check sitecheck-check-zapret sitecheck.conf; do
            cmp "files/$file" "package/luci-app-sitecheck/files/$file"
          done
      - name: Verify installer safeguards and UI actions
        run: |
          set -eu
          ! grep -q 'install -m' install.sh
          grep -q 'apk add' install.sh
          grep -q 'opkg install' install.sh
          ! grep -qi 'podkop\|failover\|pvf' files/view/index.htm
          ! grep -qi 'podkop\|failover\|pvf' files/controller/sitecheck.lua
          ! grep -q 'fetch "$BASE/files/podkop-vpn-failover"' install.sh
          ! grep -q 'cp "$TMP/podkop-vpn-failover"' install.sh
          ! grep -q 'AWG / Podkop VPN Failover' install.sh
          grep -q 'id="sc-save-auto"' files/view/index.htm
          grep -q 'save_settings' files/controller/sitecheck.lua
          grep -q 'id="sc-zm-run"' files/view/index.htm
          grep -q 'check_zapret' files/controller/sitecheck.lua
          grep -q 'curl -sL --connect-timeout 3 --max-time 5' files/sitecheck-check-zapret
          grep -q 'suite.v2.json' files/sitecheck-system-sites
          grep -q 'id="sc-zm-run"' files/view/index.htm
          grep -q 'check_zapret' files/controller/sitecheck.lua
